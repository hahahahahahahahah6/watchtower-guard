[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-guard"
version = "0.1.0"
description = "Tamper-evident integrity watcher for an agent's own guardrails: who watches the watchers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["ai-agents", "guardrails", "integrity", "tamper-evident", "audit", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
watchtower-guard = "watchtower_guard.__main__:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/watchtower-guard"
Repository = "https://github.com/hahahahahahahahah6/watchtower-guard"

[tool.setuptools.packages.find]
where = ["src"]
